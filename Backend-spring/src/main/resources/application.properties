spring.application.name=Backend-usuario

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yourpeak_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

yourpeak.internal-api-key=yourpeak-dev-internal-key
yourpeak.google-internal-key=${YOURPEAK_GOOGLE_INTERNAL_KEY:}

# IA para proponer rutinas (HU-11). Sin GEMINI_API_KEY se usa el generador por reglas.
# La clave solo se define como variable de entorno; nunca se escribe en este archivo.
yourpeak.gemini.api-key=${GEMINI_API_KEY:}
yourpeak.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
yourpeak.ia.limite-diario=${IA_LIMITE_DIARIO:5}
