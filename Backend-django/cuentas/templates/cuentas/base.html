<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YourPeak{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101412; color: #f5f7f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top right, #244b38 0, transparent 45%), #101412; }
    main { width: min(100%, 440px); padding: 38px; border: 1px solid #31483b; border-radius: 18px; background: #171d19; box-shadow: 0 24px 70px #0006; }
    .brand { color: #9ce5b5; font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 30px; }
    .muted { color: #a8b4ac; margin: 0 0 25px; }
    label { display: block; margin: 16px 0 7px; color: #d5ddd7; font-size: 14px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #3b4c41; border-radius: 9px; color: #f5f7f5; background: #101512; font: inherit; }
    input:focus { outline: 2px solid #75d796; border-color: transparent; }
    button, .button { display: inline-block; width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 9px; color: #102216; background: #8fe0a9; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    .switch { margin: 22px 0 0; color: #a8b4ac; text-align: center; font-size: 14px; }
    a { color: #9ce5b5; }
    .alert { padding: 12px; border-radius: 8px; color: #ffd9d9; background: #612f35; }
    .success { color: #b8f3c7; background: #1c4b2b; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body><main>
  <div class="brand">YourPeak</div>
  {% block content %}{% endblock %}
</main></body>
</html>
